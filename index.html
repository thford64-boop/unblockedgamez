<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcade — twenty small games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#D8DAD3;
  --card:#EFF0EC;
  --ink:#191B1C;
  --mute:#6B716C;
  --line:#C3C6BE;
  --acc:#2447C9;
  --screen:#14171A;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:clamp(20px,5vw,56px) clamp(16px,5vw,56px) 80px;
}
.wrap{max-width:1080px;margin:0 auto}
.hide{display:none !important}

/* ---------- home ---------- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:clamp(24px,4vw,44px)}
h1{
  margin:0;font-size:clamp(44px,11vw,104px);line-height:.86;letter-spacing:-.02em;
  font-variation-settings:'wdth' 120,'wght' 780;text-transform:uppercase;
}
.sub{margin:10px 0 0;color:var(--mute);max-width:34ch;font-size:15px}
.count{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);white-space:nowrap;padding-bottom:6px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.tile{
  appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.tile:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 6px 0 -2px rgba(25,27,28,.18)}
.tile:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.tile canvas{display:block;width:44px;height:44px;transition:transform .18s ease}
.tile:hover canvas{transform:translateY(-1px) rotate(-3deg)}
.tile h2{margin:0;font-size:20px;line-height:1.1;font-variation-settings:'wdth' 108,'wght' 700;letter-spacing:-.01em}
.tile p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.45}
.tile .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}

/* ---------- player ---------- */
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
.back{appearance:none;font:inherit;cursor:pointer;background:none;border:1px solid var(--line);
  border-radius:3px;padding:7px 13px;font-size:13px;color:var(--ink);transition:border-color .15s,background .15s}
.back:hover{border-color:var(--ink);background:var(--card)}
.back:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gname{font-size:clamp(24px,4vw,34px);font-variation-settings:'wdth' 115,'wght' 760;
  text-transform:uppercase;letter-spacing:-.01em;line-height:1;margin-right:auto}
.readout{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.readout b{color:var(--ink);font-weight:600;font-size:15px;margin-left:6px;letter-spacing:0}

.stage{position:relative;display:flex;justify-content:center}
.screen{position:relative;background:var(--screen);border-radius:4px;padding:10px;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px -18px rgba(0,0,0,.9)}
canvas#cv{display:block;touch-action:none;border-radius:2px;background:var(--screen)}
.over{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;background:rgba(20,23,26,.86);border-radius:2px;text-align:center;padding:20px;color:#EDEEE9}
.over h3{margin:0;font-size:26px;font-variation-settings:'wdth' 112,'wght' 720;text-transform:uppercase}
.over p{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8B9299}
.over button{appearance:none;font:inherit;cursor:pointer;margin-top:12px;background:#EDEEE9;color:#14171A;
  border:0;border-radius:3px;padding:9px 18px;font-size:14px;font-variation-settings:'wght' 600}
.over button:focus-visible{outline:2px solid #5B8CFF;outline-offset:3px}
.hint{margin:16px auto 0;text-align:center;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">

  <section id="home">
    <header class="masthead">
      <div>
        <h1>Arcade</h1>
        <p class="sub">Twenty small games, hand-built in one file. Nothing to install, nothing to load. Pick one.</p>
      </div>
      <div class="count" id="count"></div>
    </header>
    <div class="grid" id="grid"></div>
    <footer>Keyboard or touch &nbsp;·&nbsp; scores reset when you close the page</footer>
  </section>

  <section id="player" class="hide">
    <div class="bar">
      <button class="back" id="back">← All games</button>
      <div id="gname"></div>
      <div class="readout">Score<b id="score">0</b></div>
      <div class="readout" id="bestWrap">Best<b id="best">0</b></div>
    </div>
    <div class="stage">
      <div class="screen">
        <canvas id="cv"></canvas>
        <div class="over hide" id="over">
          <h3 id="overTitle">Game over</h3>
          <p id="overLine"></p>
          <button id="again">Play again</button>
        </div>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </section>

</div>
<script>
"use strict";
/* ============================== helpers ============================== */
var $ = function(s){ return document.querySelector(s); };
var rand = function(a,b){ return a + Math.random()*(b-a); };
var randi = function(a,b){ return Math.floor(rand(a,b)); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
function rrect(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function fillR(g,x,y,w,h,r,col){ g.fillStyle=col; rrect(g,x,y,w,h,r); g.fill(); }
function text(g,str,x,y,size,col,align,weight){
  g.fillStyle=col; g.textAlign=align||'left'; g.textBaseline='middle';
  g.font=(weight||600)+' '+size+'px ui-monospace,SFMono-Regular,Menlo,monospace';
  g.fillText(str,x,y);
}

/* on-screen palette (inside the dark cabinet) */
var P = {
  bg:'#14171A', panel:'#1B2025', grid:'#242A30', line:'#2E353C',
  ink:'#EDEEE9', dim:'#7C858C',
  acc:'#5B8CFF', hot:'#FF7A59', good:'#7BD88F', gold:'#F2C14E', plum:'#C48BF2', aqua:'#5BD1D7'
};
/* card glyph palette (on paper) */
var IC = { line:'#191B1C', acc:'#2447C9', soft:'#A9AEA6' };

/* ============================== games ============================== */
var GAMES = [
/* ---------------------------------------------------------------- flappy */
{
  id:'flappy', name:'Flappy', kind:'Reflex',
  blurb:'Flap through the gaps. One tap of altitude at a time.',
  hint:'Space, click or tap to flap',
  w:360, h:560,
  icon:function(g){
    g.fillStyle=IC.line;
    g.fillRect(6,0,8,15); g.fillRect(6,27,8,17);
    g.fillRect(30,0,8,25); g.fillRect(30,37,8,7);
    g.fillStyle=IC.acc; g.beginPath(); g.arc(22,21,5.5,0,7); g.fill();
  },
  make:function(env){
    var W=env.W, H=env.H, GY=H-44, R=13, BX=80, GAP=152, PW=56, SPD=168, G=1500;
    var y=H*0.45, v=0, t=0, live=false, sc=0, pipes=[], wing=0;
    function flap(){ live=true; v=-425; wing=0.14; }
    return {
      key:function(k,d){ if(d && (k===' '||k==='arrowup'||k==='w')) flap(); },
      tap:flap,
      update:function(dt){
        t+=dt;
        if(!live){ y = H*0.45 + Math.sin(t*4)*7; return; }
        v += G*dt; y += v*dt; wing = Math.max(0, wing-dt);
        var lastP = pipes[pipes.length-1];
        if(!lastP || lastP.x < W-176) pipes.push({x:W+20, gy:rand(64, H-GAP-116), s:false});
        for(var i=0;i<pipes.length;i++){
          var p=pipes[i]; p.x -= SPD*dt;
          if(!p.s && p.x+PW < BX-R){ p.s=true; sc++; env.setScore(sc); }
          if(BX+R>p.x && BX-R<p.x+PW && (y-R<p.gy || y+R>p.gy+GAP)) env.end();
        }
        while(pipes.length && pipes[0].x < -PW) pipes.shift();
        if(y+R>GY || y-R<-50) env.end();
      },
      draw:function(g){
        g.fillStyle=P.panel; g.fillRect(0,0,W,GY);
        g.fillStyle=P.grid;
        for(var i=0;i<5;i++) g.fillRect(0, 60+i*96, W, 1);
        for(var j=0;j<pipes.length;j++){
          var p=pipes[j];
          g.fillStyle=P.good;
          g.fillRect(p.x, 0, PW, p.gy);
          g.fillRect(p.x, p.gy+GAP, PW, GY-p.gy-GAP);
          g.fillStyle='#5FBF74';
          g.fillRect(p.x-4, p.gy-16, PW+8, 16);
          g.fillRect(p.x-4, p.gy+GAP, PW+8, 16);
        }
        g.fillStyle=P.line; g.fillRect(0,GY,W,2);
        g.fillStyle=P.grid; g.fillRect(0,GY+2,W,H-GY);
        var tilt = clamp(v/900, -0.5, 0.9);
        g.save(); g.translate(BX,y); g.rotate(live?tilt:0);
        g.fillStyle=P.gold; g.beginPath(); g.arc(0,0,R,0,7); g.fill();
        g.fillStyle=P.bg; g.beginPath(); g.arc(5,-4,2.4,0,7); g.fill();
        g.fillStyle=P.hot; g.beginPath(); g.moveTo(11,1); g.lineTo(19,3); g.lineTo(11,6); g.fill();
        g.fillStyle='#D9A93F'; g.fillRect(-9, wing>0?-6:0, 11, 5);
        g.restore();
        if(!live){ text(g,'TAP TO START', W/2, H*0.62, 12, P.dim, 'center'); }
      }
    };
  }
},
/* ---------------------------------------------------------------- slope */
{
  id:'slope', name:'Slope', kind:'Endless',
  blurb:'Steer a ball down a shrinking chute. It only gets faster.',
  hint:'Arrows / A D, or hold left & right side of the screen',
  w:360, h:560,
  icon:function(g){
    g.strokeStyle=IC.line; g.lineWidth=2.5;
    g.beginPath(); g.moveTo(19,3); g.lineTo(3,42); g.moveTo(25,3); g.lineTo(41,42); g.stroke();
    g.strokeStyle=IC.soft; g.lineWidth=2;
    g.beginPath(); g.moveTo(15,16); g.lineTo(29,16); g.moveTo(10,29); g.lineTo(34,29); g.stroke();
    g.fillStyle=IC.acc; g.beginPath(); g.arc(22,36,5,0,7); g.fill();
  },
  make:function(env){
    var W=env.W, H=env.H, HZ=H*0.30, EDGE=1.15;
    var px=0, vx=0, sp=9, dist=0, obs=[], next=0.7, last=-1;
    function proj(z){ return 260/(z+1.25); }
    function sx(x,s){ return W/2 + x*s*1.15; }
    function sy(s){ return HZ + s*1.42; }
    return {
      update:function(dt){
        var dir = (env.keys['arrowright']||env.keys['d']?1:0) - (env.keys['arrowleft']||env.keys['a']?1:0);
        if(env.ptr.down) dir = env.ptr.x < W/2 ? -1 : 1;
        vx += (dir*2.5 - vx) * Math.min(1, dt*9);
        px += vx*dt;
        sp += dt*0.5; dist += sp*dt;
        var s = Math.floor(dist);
        if(s !== last){ last=s; env.setScore(s); }
        next -= dt;
        if(next <= 0){
          next = clamp(4.2/sp, 0.16, 0.5);
          var gap = rand(-0.55, 0.55);
          for(var k=-1;k<=1;k++){
            var ox = gap + k*0.78;
            if(Math.abs(ox - gap) < 0.1) continue;
            if(Math.abs(ox) < 1.0) obs.push({x:ox, z:26});
          }
          if(Math.random()<0.45){
            var extra = clamp(gap + (Math.random()<0.5?1.5:-1.5), -0.95, 0.95);
            if(Math.abs(extra-gap) > 0.55) obs.push({x:extra, z:26});
          }
        }
        for(var i=obs.length-1;i>=0;i--){
          var o=obs[i]; o.z -= sp*dt;
          if(o.z < -1.2){ obs.splice(i,1); continue; }
          if(o.z < 0.5 && o.z > -0.45 && Math.abs(o.x-px) < 0.30) env.end('You hit a block');
        }
        if(Math.abs(px) > 1.06) env.end('You rolled off the edge');
      },
      draw:function(g){
        g.fillStyle='#0F1214'; g.fillRect(0,0,W,H);
        var zn=-0.5, zf=26, sN=proj(zn), sF=proj(zf);
        g.fillStyle=P.panel;
        g.beginPath();
        g.moveTo(sx(-EDGE,sF), sy(sF)); g.lineTo(sx(EDGE,sF), sy(sF));
        g.lineTo(sx(EDGE,sN), sy(sN)); g.lineTo(sx(-EDGE,sN), sy(sN));
        g.closePath(); g.fill();
        var off = dist % 3.2;
        for(var i=0;i<20;i++){
          var z0 = i*3.2 - off, z1 = z0+1.6;
          if(z1 < zn) continue; if(z0 > zf) break;
          z0 = Math.max(z0, zn);
          var a=proj(z0), b=proj(z1);
          g.fillStyle=P.grid;
          g.beginPath();
          g.moveTo(sx(-EDGE,b), sy(b)); g.lineTo(sx(EDGE,b), sy(b));
          g.lineTo(sx(EDGE,a), sy(a)); g.lineTo(sx(-EDGE,a), sy(a));
          g.closePath(); g.fill();
        }
        g.strokeStyle=P.acc; g.lineWidth=2;
        g.beginPath();
        g.moveTo(sx(-EDGE,sF), sy(sF)); g.lineTo(sx(-EDGE,sN), sy(sN));
        g.moveTo(sx(EDGE,sF), sy(sF)); g.lineTo(sx(EDGE,sN), sy(sN));
        g.stroke();
        obs.sort(function(a,b){ return b.z-a.z; });
        for(var j=0;j<obs.length;j++){
          var o=obs[j]; if(o.z < zn) continue;
          var s=proj(o.z), w=0.62*s, h=0.5*s, cx=sx(o.x,s), by=sy(s);
          g.fillStyle=P.hot; g.fillRect(cx-w/2, by-h, w, h);
          g.fillStyle='#FFA98F'; g.fillRect(cx-w/2, by-h, w, Math.max(2,h*0.16));
        }
        var ps=proj(0), pxx=sx(px,ps), pyy=sy(ps)-16;
        g.fillStyle='rgba(0,0,0,.35)';
        g.beginPath(); g.ellipse(pxx, pyy+18, 17, 5, 0, 0, 7); g.fill();
        g.fillStyle=P.ink; g.beginPath(); g.arc(pxx, pyy, 15, 0, 7); g.fill();
        g.strokeStyle=P.acc; g.lineWidth=3; g.beginPath(); g.arc(pxx, pyy, 15, 0.6, 2.6); g.stroke();
      }
    };
  }
},
/* ---------------------------------------------------------------- snake */
{
  id:'snake', name:'Snake', kind:'Classic',
  blurb:'Eat, grow, and try not to write yourself into a corner.',
  hint:'Arrows / WASD, or swipe',
  w:400, h:400,
  icon:function(g){
    g.fillStyle=IC.line;
    g.fillRect(4,20,10,10); g.fillRect(15,20,10,10); g.fillRect(15,9,10,10);
    g.fillStyle=IC.acc; g.fillRect(30,9,9,9);
    g.strokeStyle=IC.soft; g.lineWidth=1; g.strokeRect(3.5,8.5,37,26);
  },
  make:function(env){
    var W=env.W, N=20, CS=W/N;
    var sn=[{x:9,y:10},{x:8,y:10},{x:7,y:10}], dir={x:1,y:0}, nd={x:1,y:0};
    var food={x:14,y:10}, acc=0, step=0.125, sc=0;
    function place(){
      var free=[];
      for(var y=0;y<N;y++) for(var x=0;x<N;x++){
        var hit=false;
        for(var i=0;i<sn.length;i++) if(sn[i].x===x&&sn[i].y===y) hit=true;
        if(!hit) free.push({x:x,y:y});
      }
      food = free[randi(0,free.length)];
    }
    function turn(x,y){ if(x===-dir.x && y===-dir.y) return; nd={x:x,y:y}; }
    function tick(){
      dir=nd;
      var h={x:sn[0].x+dir.x, y:sn[0].y+dir.y};
      if(h.x<0||h.y<0||h.x>=N||h.y>=N) return env.end('You hit the wall');
      for(var i=0;i<sn.length-1;i++) if(sn[i].x===h.x&&sn[i].y===h.y) return env.end('You ate yourself');
      sn.unshift(h);
      if(h.x===food.x && h.y===food.y){ sc++; env.setScore(sc); step=Math.max(0.06, step-0.0035); place(); }
      else sn.pop();
    }
    return {
      key:function(k,d){
        if(!d) return;
        if(k==='arrowup'||k==='w') turn(0,-1);
        else if(k==='arrowdown'||k==='s') turn(0,1);
        else if(k==='arrowleft'||k==='a') turn(-1,0);
        else if(k==='arrowright'||k==='d') turn(1,0);
      },
      swipe:function(d){
        if(d==='up') turn(0,-1); else if(d==='down') turn(0,1);
        else if(d==='left') turn(-1,0); else turn(1,0);
      },
      update:function(dt){ acc+=dt; while(acc>=step){ acc-=step; if(!env.dead) tick(); } },
      draw:function(g){
        g.fillStyle=P.panel; g.fillRect(0,0,W,W);
        g.fillStyle=P.grid;
        for(var i=1;i<N;i++){ g.fillRect(i*CS,0,1,W); g.fillRect(0,i*CS,W,1); }
        fillR(g, food.x*CS+5, food.y*CS+5, CS-10, CS-10, 5, P.hot);
        for(var s=sn.length-1;s>=0;s--){
          var c = s===0 ? P.ink : (s%2 ? P.good : '#66C97C');
          fillR(g, sn[s].x*CS+2, sn[s].y*CS+2, CS-4, CS-4, 4, c);
        }
      }
    };
  }
},
/* ---------------------------------------------------------------- breakout */
{
  id:'break', name:'Breaker', kind:'Classic',
  blurb:'Clear the wall. Every level the ball gets meaner.',
  hint:'Move the mouse or finger · Arrows also work',
  w:420, h:560,
  icon:function(g){
    g.fillStyle=IC.line;
    for(var r=0;r<2;r++) for(var c=0;c<4;c++) g.fillRect(4+c*10, 5+r*8, 8, 6);
    g.fillStyle=IC.acc; g.fillRect(13,38,18,4);
    g.beginPath(); g.arc(26,29,3.5,0,7); g.fill();
  },
  make:function(env){
    var W=env.W, H=env.H, PW=88, PH=12, PY=H-46, R=8;
    var px=W/2, bx=W/2, by=PY-20, bvx=180, bvy=-300, lives=3, sc=0, lvl=1, bricks=[], stuck=true;
    var COLS=7, ROWS=5, GAP=8, LEFT=24, TOP=88;
    var BW=(W-LEFT*2-GAP*(COLS-1))/COLS, BH=20;
    var tones=[P.hot,P.gold,P.good,P.aqua,P.acc];
    function build(){
      bricks=[];
      for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++)
        bricks.push({x:LEFT+c*(BW+GAP), y:TOP+r*(BH+GAP), a:true, c:tones[r]});
    }
    function launch(){
      stuck=false;
      var sp=290+lvl*22, a=rand(0.9,2.24);
      bvx = Math.cos(a)*sp; bvy = -Math.abs(Math.sin(a)*sp);
    }
    build();
    return {
      key:function(k,d){ if(d && (k===' '||k==='arrowup') && stuck) launch(); },
      tap:function(){ if(stuck) launch(); },
      update:function(dt){
        var kd = (env.keys['arrowright']||env.keys['d']?1:0)-(env.keys['arrowleft']||env.keys['a']?1:0);
        if(kd) px += kd*470*dt;
        else if(env.ptr.active) px = env.ptr.x;
        px = clamp(px, PW/2, W-PW/2);
        if(stuck){ bx=px; by=PY-R-2; return; }
        bx += bvx*dt; by += bvy*dt;
        if(bx<R){ bx=R; bvx=Math.abs(bvx); }
        if(bx>W-R){ bx=W-R; bvx=-Math.abs(bvx); }
        if(by<R+34){ by=R+34; bvy=Math.abs(bvy); }
        if(by>PY-R && by<PY+PH && bvy>0 && bx>px-PW/2-R && bx<px+PW/2+R){
          by = PY-R;
          var off = clamp((bx-px)/(PW/2+R), -1, 1);
          var ang = -Math.PI/2 + off*1.0;
          var spd = Math.min(520, Math.sqrt(bvx*bvx+bvy*bvy) + 7);

  },
  make:function(env){
    var W=env.W, H=env.H, COLS=10, ROWS=20, CS=26, OX=30, OY=52;
    var PIECES = {
      I:{n:4,c:[[0,1],[1,1],[2,1],[3,1]],col:P.aqua},
      J:{n:3,c:[[0,0],[0,1],[1,1],[2,1]],col:P.acc},
      L:{n:3,c:[[2,0],[0,1],[1,1],[2,1]],col:'#F2A24E'},
      O:{n:2,c:[[0,0],[1,0],[0,1],[1,1]],col:P.gold},
      S:{n:3,c:[[1,0],[2,0],[0,1],[1,1]],col:P.good},
      T:{n:3,c:[[1,0],[0,1],[1,1],[2,1]],col:P.plum},
      Z:{n:3,c:[[0,0],[1,0],[1,1],[2,1]],col:P.hot}
    };
    var KEYS = Object.keys(PIECES);
    var board=[], cur=null, nxt=null, drop=0, lines=0, lvl=1, sc=0;
    for(var r=0;r<ROWS;r++){ board.push([]); for(var c=0;c<COLS;c++) board[r].push(null); }
    function make(k){ var d=PIECES[k]; return {k:k, n:d.n, col:d.col, c:d.c.map(function(p){return [p[0],p[1]];}), x:3, y:-1}; }
    function bag(){ return KEYS[randi(0,KEYS.length)]; }
    function fits(p, dx, dy, cells){
      var cs = cells||p.c;
      for(var i=0;i<cs.length;i++){
        var x=p.x+cs[i][0]+dx, y=p.y+cs[i][1]+dy;
        if(x<0||x>=COLS||y>=ROWS) return false;
        if(y>=0 && board[y][x]) return false;
      }
      return true;
    }
    function rot(p){
      var n=p.n;
      var cells = p.c.map(function(c){ return [n-1-c[1], c[0]]; });

    function lock(){
      for(var i=0;i<cur.c.length;i++){
        var x=cur.x+cur.c[i][0], y=cur.y+cur.c[i][1];

    spawn();
    return {
      key:function(k,d){
        if(!d||!cur) return;
        if(k==='arrowleft'||k==='a'){ if(fits(cur,-1,0)) cur.x--; }
        else if(k==='arrowright'||k==='d'){ if(fits(cur,1,0)) cur.x++; }
        else if(k==='arrowup'||k==='w') rot(cur);
        else if(k===' ') hard();

      tap:function(x,y){

      update:function(dt){

    ];
    var li=0, walls=[], goals=[], boxes=[], px=0, py=0, cols=0, rows=0, moves=0, done=false;

      var L=LV[i], x, y;
      cells=[]; mirrors=[];
      for(y=0;y<N;y++) for(x=0;x<N;x++) cells.push(L.g[y].charAt(x));
      for(x=0;x<L.m.length;x++) mirrors.push({x:L.m[x].x, y:L.m[x].y, s:L.m[x].s});
      E=L.e; moves=0;
      trace();
    }
    function mirrorAt(x,y){
      for(var i=0;i<mirrors.length;i++) if(mirrors[i].x===x && mirrors[i].y===y) return mirrors[i];
      return null;
    }
    function trace(){
      var x=E.x, y=E.y, dx=E.dx, dy=E.dy, path=[], hit=[], guard=0, t;
      while(guard++ < 220){
        if(x<0||y<0||x>=N||y>=N) break;
        if(cells[y*N+x]==='#') break;
        path.push({x:x, y:y});
        if(cells[y*N+x]==='T' && hit.indexOf(y*N+x)<0) hit.push(y*N+x);
        var m=mirrorAt(x,y);
        if(m){
          if(m.s){ t=dx; dx=-dy; dy=-t; }
          else { t=dx; dx=dy; dy=t; }
        }
        x+=dx; y+=dy;
      }
      var total=0;
      for(var i=0;i<cells.length;i++) if(cells[i]==='T') total++;
      beam={path:path, hit:hit, endx:x, endy:y, total:total};
      return hit.length===total;
    }
    load(0);
    return {
      tap:function(x,y){
        if(done) return;
        var gx=Math.floor((x-OX)/CS), gy=Math.floor((y-OY)/CS);
        var m=mirrorAt(gx,gy);
        if(!m) return;
        m.s = m.s ? 0 : 1;
        moves++;
        if(trace()){
          li++; env.setScore(li);
          if(li>=LV.length){ done=true; env.end('All five beams routed'); }
          else load(li);
        }
      },
      update:function(){},
      draw:function(g){
        g.fillStyle=P.bg; g.fillRect(0,0,W,H);
        var x, y, i, cx, cy;
        text(g,'LAYOUT', 24, 40, 11, P.dim);
        text(g,(li+1)+' / '+LV.length, 24, 60, 18, P.ink);
        text(g,'CRYSTALS '+beam.hit.length+' / '+beam.total, W-24, 46, 11,
             beam.hit.length===beam.total?P.gold:P.dim, 'right');
        text(g,'FLIPS '+moves, W-24, 64, 11, P.dim, 'right');
        for(y=0;y<N;y++) for(x=0;x<N;x++){
          cx=OX+x*CS; cy=OY+y*CS;
          var ch=cells[y*N+x];
          fillR(g, cx+1, cy+1, CS-2, CS-2, 2, ch==='#'?P.line:P.panel);
        }
        g.fillStyle=P.gold;
        g.beginPath();
        var ex=OX+E.x*CS+CS/2 - E.dx*CS, ey=OY+E.y*CS+CS/2 - E.dy*CS;
        g.moveTo(ex+E.dx*11, ey+E.dy*11);
        g.lineTo(ex-E.dy*9-E.dx*7, ey+E.dx*9-E.dy*7);
        g.lineTo(ex+E.dy*9-E.dx*7, ey-E.dx*9-E.dy*7);
        g.closePath(); g.fill();
        if(beam.path.length){
          g.strokeStyle=P.gold; g.lineWidth=3; g.globalAlpha=0.9;
          g.beginPath();
          g.moveTo(ex, ey);
          for(i=0;i<beam.path.length;i++)
            g.lineTo(OX+beam.path[i].x*CS+CS/2, OY+beam.path[i].y*CS+CS/2);
          g.lineTo(OX+beam.endx*CS+CS/2, OY+beam.endy*CS+CS/2);
          g.stroke();
          g.globalAlpha=1;
        }
        for(y=0;y<N;y++) for(x=0;x<N;x++){
          if(cells[y*N+x]!=='T') continue;
          cx=OX+x*CS+CS/2; cy=OY+y*CS+CS/2;
          var on=beam.hit.indexOf(y*N+x)>=0;
          g.fillStyle=on?P.gold:P.dim;
          g.beginPath();
          g.moveTo(cx,cy-13); g.lineTo(cx+13,cy); g.lineTo(cx,cy+13); g.lineTo(cx-13,cy);
          g.closePath(); g.fill();
          if(on){ g.fillStyle=P.bg; g.beginPath(); g.arc(cx,cy,4,0,7); g.fill(); }
        }
        for(i=0;i<mirrors.length;i++){
          var m=mirrors[i];
          cx=OX+m.x*CS; cy=OY+m.y*CS;
          g.strokeStyle=P.aqua; g.lineWidth=5; g.lineCap='round';
          g.beginPath();
          if(m.s){ g.moveTo(cx+CS-11, cy+11); g.lineTo(cx+11, cy+CS-11); }
          else { g.moveTo(cx+11, cy+11); g.lineTo(cx+CS-11, cy+CS-11); }
          g.stroke();
        }
      }
    };
  }
},
/* ---------------------------------------------------------------- echo */
{
  id:'echo', name:'Echo', kind:'Puzzle',
  blurb:'A maze with the lights off. Each ping paints the walls for a second, then they fade.',
  hint:'Arrows / WASD or drag to move · Space or the ping pad to look around',
  w:460, h:480,
  icon:function(g){
    g.strokeStyle=IC.soft; g.lineWidth=1.5;
    g.beginPath(); g.arc(20,24,17,0,7); g.stroke();
    g.strokeStyle=IC.line; g.lineWidth=2;
    g.beginPath(); g.arc(20,24,9,0,7); g.stroke();
    g.fillStyle=IC.acc; g.beginPath(); g.arc(20,24,4,0,7); g.fill();
    g.fillStyle=IC.line; g.fillRect(34,36,8,8);
  },
  make:function(env){
    var W=env.W, H=env.H, N=15, CS=28, OX=(W-N*CS)/2, OY=54;
    var wall=[], bri=[], px=0, py=0, pings=[], cool=0, auto=0, sc=0, time=45, done=false;
    var exitX=0, exitY=0;
    function build(){
      var i, x, y;
      wall=[]; bri=[];
      for(i=0;i<N*N;i++){ wall.push(true); bri.push(0); }
      var stack=[[1,1]];
      wall[1*N+1]=false;
      while(stack.length){
        var c=stack[stack.length-1], cx=c[0], cy=c[1], opts=[];
        var D=[[2,0],[-2,0],[0,2],[0,-2]];
        for(i=0;i<4;i++){
          var nx=cx+D[i][0], ny=cy+D[i][1];
          if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&wall[ny*N+nx]) opts.push(D[i]);
        }
        if(!opts.length){ stack.pop(); continue; }
        var d=opts[randi(0,opts.length)];
        wall[(cy+d[1]/2)*N+(cx+d[0]/2)]=false;
        wall[(cy+d[1])*N+(cx+d[0])]=false;
        stack.push([cx+d[0], cy+d[1]]);
      }
      exitX=N-2; exitY=N-2;
      px=1*CS+CS/2; py=1*CS+CS/2;
      pings=[{x:px, y:py, r:0}];
      auto=0;
    }
    build();
    function hits(x,y){
      var r=9, a=Math.floor((x-r)/CS), b=Math.floor((x+r)/CS);
      var c=Math.floor((y-r)/CS), d=Math.floor((y+r)/CS), gx, gy;
      for(gy=c;gy<=d;gy++) for(gx=a;gx<=b;gx++){
        if(gx<0||gy<0||gx>=N||gy>=N) return true;
        if(wall[gy*N+gx]) return true;
      }
      return false;
    }
    function ping(){
      if(cool>0) return;
      cool=0.45;
      pings.push({x:px, y:py, r:0});
      if(pings.length>4) pings.shift();
    }
    return {
      key:function(k,d){ if(d && (k===' '||k==='e')) ping(); },
      tap:function(x,y){ if(y<46 && x>W-96) ping(); },
      update:function(dt){
        if(done) return;
        cool-=dt; auto-=dt; time-=dt;
        if(time<=0){ done=true; time=0; return env.end('Out of time with '+sc+' cleared'); }
        if(auto<=0){ auto=1.5; cool=0; ping(); }
        var dx=(env.keys['arrowright']||env.keys['d']?1:0)-(env.keys['arrowleft']||env.keys['a']?1:0);
        var dy=(env.keys['arrowdown']||env.keys['s']?1:0)-(env.keys['arrowup']||env.keys['w']?1:0);
        if(env.ptr.down && env.ptr.y>OY){
          var tx=env.ptr.x-OX-px, ty=env.ptr.y-OY-py, m=Math.sqrt(tx*tx+ty*ty);
          if(m>8){ dx=tx/m; dy=ty/m; } else { dx=0; dy=0; }
        } else if(dx&&dy){ dx*=0.7071; dy*=0.7071; }
        var nx=px+dx*104*dt; if(!hits(nx,py)) px=nx;
        var ny=py+dy*104*dt; if(!hits(px,ny)) py=ny;
        var i, j;
        for(i=0;i<bri.length;i++) if(bri[i]>0) bri[i]=Math.max(0, bri[i]-dt*0.5);
        for(i=pings.length-1;i>=0;i--){
          pings[i].r += 330*dt;
          if(pings[i].r > 660){ pings.splice(i,1); continue; }
          var pr=pings[i].r;
          for(j=0;j<wall.length;j++){
            if(!wall[j]) continue;
            var wx=(j%N)*CS+CS/2 - pings[i].x, wy=Math.floor(j/N)*CS+CS/2 - pings[i].y;
            var d2=Math.sqrt(wx*wx+wy*wy);
            if(d2 > pr-17 && d2 < pr+17) bri[j]=1;
          }
        }
        for(j=0;j<wall.length;j++){
          if(!wall[j]) continue;
          var ax=(j%N)*CS+CS/2-px, ay=Math.floor(j/N)*CS+CS/2-py;
          if(ax*ax+ay*ay < 1500 && bri[j]<0.4) bri[j]=0.4;
        }
        if(Math.abs(px-(exitX*CS+CS/2))<14 && Math.abs(py-(exitY*CS+CS/2))<14){
          sc++; env.setScore(sc); time += 18; build();
        }
      },
      draw:function(g){
        g.fillStyle='#0D0F11'; g.fillRect(0,0,W,H);
        var i;
        text(g,'CLEARED '+sc, 14, 22, 12, P.ink);
        text(g, time.toFixed(1)+'s', W-110, 22, 12, time<10?P.hot:P.gold, 'right');
        fillR(g, W-92, 10, 78, 26, 4, cool>0?P.grid:P.panel);
        text(g,'PING', W-53, 24, 11, cool>0?P.dim:P.acc, 'center');
        g.fillStyle=P.grid; g.fillRect(14, 40, W-28, 3);
        g.fillStyle=P.acc; g.fillRect(14, 40, (W-28)*clamp(time/60,0,1), 3);
        for(i=0;i<wall.length;i++){
          if(!wall[i]) continue;
          g.globalAlpha = 0.03 + bri[i]*0.85;
          g.fillStyle = bri[i]>0.6 ? P.acc : P.line;
          g.fillRect(OX+(i%N)*CS, OY+Math.floor(i/N)*CS, CS, CS);
        }
        g.globalAlpha=1;
        for(i=0;i<pings.length;i++){
          g.globalAlpha = clamp(1-pings[i].r/660, 0, 1)*0.35;
          g.strokeStyle=P.acc; g.lineWidth=2;
          g.beginPath(); g.arc(OX+pings[i].x, OY+pings[i].y, pings[i].r, 0, 7); g.stroke();
        }
        g.globalAlpha=1;
        var exx=OX+exitX*CS+CS/2, exy=OY+exitY*CS+CS/2;
        g.globalAlpha=0.55; g.strokeStyle=P.gold; g.lineWidth=2;
        g.beginPath(); g.arc(exx, exy, 9, 0, 7); g.stroke();
        g.globalAlpha=1;
        g.fillStyle=P.ink; g.beginPath(); g.arc(OX+px, OY+py, 7, 0, 7); g.fill();
      }
    };
  }
}
];

/* ============================== home grid ============================== */
var grid = $('#grid');
$('#count').textContent = GAMES.length + ' games';
GAMES.forEach(function(def){
  var b = document.createElement('button');
  b.className = 'tile';
  b.type = 'button';
  b.setAttribute('aria-label','Play ' + def.name);
  var cvi = document.createElement('canvas');
  var d = window.devicePixelRatio || 1;
  cvi.width = 44*d; cvi.height = 44*d;
  var ig = cvi.getContext('2d');
  ig.setTransform(d,0,0,d,0,0);
  def.icon(ig);
  var head = document.createElement('div');
  head.className = 'kind';
  head.textContent = def.kind;
  var h2 = document.createElement('h2'); h2.textContent = def.name;
  var p = document.createElement('p'); p.textContent = def.blurb;
  b.appendChild(cvi); b.appendChild(head); b.appendChild(h2); b.appendChild(p);
  b.addEventListener('click', function(){ openGame(def); });
  grid.appendChild(b);
});

/* ============================== engine ============================== */
var cv = $('#cv'), g = cv.getContext('2d');
var home = $('#home'), player = $('#player'), overEl = $('#over');
var cur = null, raf = 0, last = 0;
var keys = Object.create(null);
var ptr = { x:-1, y:-1, down:false, active:false };
var bests = {};

function fit(){
  if(!cur) return;
  var d = window.devicePixelRatio || 1, def = cur.def;
  cv.width = def.w*d; cv.height = def.h*d;
  g.setTransform(d,0,0,d,0,0);
  var maxW = Math.min(document.querySelector('.wrap').clientWidth - 20, 640);
  var maxH = Math.max(240, window.innerHeight - 250);
  var s = Math.min(maxW/def.w, maxH/def.h);
  cv.style.width = Math.round(def.w*s) + 'px';
  cv.style.height = Math.round(def.h*s) + 'px';
}
window.addEventListener('resize', fit);

function openGame(def){
  cur = { def:def, inst:null, over:false, score:0 };
  $('#gname').textContent = def.name;
  $('#hint').textContent = def.hint;
  $('#best').textContent = bests[def.id] === undefined ? '—' : bests[def.id];
  $('#bestWrap').classList.toggle('hide', !!def.noBest);
  home.classList.add('hide');
  player.classList.remove('hide');
  fit();
  start();
  window.scrollTo(0,0);
}

function start(){
  for(var k in keys) keys[k] = false;
  ptr.down = false; ptr.active = false; ptr.x = -1; ptr.y = -1;
  cur.over = false; cur.score = 0;
  $('#score').textContent = '0';
  overEl.classList.add('hide');
  var env = {
    W: cur.def.w, H: cur.def.h, keys: keys, ptr: ptr, dead: false,
    setScore: function(v){ cur.score = v; $('#score').textContent = v; },
    end: function(msg){ gameOver(msg); }
  };
  cur.env = env;
  cur.inst = cur.def.make(env);
  last = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
}

function frame(ts){
  raf = requestAnimationFrame(frame);
  var dt = Math.min(0.05, (ts - last)/1000);
  last = ts;
  if(!cur) return;
  if(!cur.over && cur.inst.update) cur.inst.update(dt);
  g.fillStyle = P.bg;
  g.fillRect(0,0,cur.def.w,cur.def.h);
  cur.inst.draw(g);
}

function gameOver(msg){
  if(cur.over) return;
  cur.over = true;
  cur.env.dead = true;
  var s = cur.score, best = bests[cur.def.id];
  if(typeof s === 'number'){
    if(best === undefined || (cur.def.lowBest ? s < best : s > best)) bests[cur.def.id] = s;
    $('#best').textContent = bests[cur.def.id];
  }
  $('#overTitle').textContent = (msg && /win|clear|solve/i.test(msg)) ? 'Nice' : 'Game over';
  $('#overLine').textContent = (msg || 'That run is done') + ' · score ' + cur.score;
  overEl.classList.remove('hide');
  $('#again').focus();
}

function goHome(){
  cancelAnimationFrame(raf);
  cur = null;
  player.classList.add('hide');
  home.classList.remove('hide');
}
$('#back').addEventListener('click', goHome);
$('#again').addEventListener('click', function(){ if(cur) start(); });

/* ---------- input ---------- */
window.addEventListener('keydown', function(e){
  if(!cur) return;
  var k = e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k) >= 0) e.preventDefault();
  if(k === 'escape'){ goHome(); return; }
  if(cur.over){ if(k === ' ' || k === 'enter') start(); return; }
  if(!keys[k]){ keys[k] = true; if(cur.inst.key) cur.inst.key(k, true); }
});
function clearKeys(){
  for(var k in keys) keys[k] = false;
  ptr.down = false; ptr.active = false;
}
window.addEventListener('blur', clearKeys);
document.addEventListener('visibilitychange', function(){ if(document.hidden) clearKeys(); });

window.addEventListener('keyup', function(e){
  if(!cur) return;
  var k = e.key.toLowerCase();
  keys[k] = false;
  if(!cur.over && cur.inst && cur.inst.key) cur.inst.key(k, false);
});

function pos(e){
  var r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left)/r.width*cur.def.w, y:(e.clientY - r.top)/r.height*cur.def.h };
}
var sx0 = 0, sy0 = 0;
cv.addEventListener('pointerdown', function(e){
  if(!cur) return;
  e.preventDefault();
  if(e.button === 2) return;
  cv.setPointerCapture(e.pointerId);
  var p = pos(e);
  ptr.down = true; ptr.active = true; ptr.x = p.x; ptr.y = p.y; sx0 = p.x; sy0 = p.y;
  if(cur.over){ start(); return; }
  if(cur.inst.tap) cur.inst.tap(p.x, p.y, e.button);
});
cv.addEventListener('pointermove', function(e){
  if(!cur) return;
  var p = pos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.active = true;
});
cv.addEventListener('pointerup', function(e){
  if(!cur) return;
  ptr.down = false;
  var p = pos(e), dx = p.x - sx0, dy = p.y - sy0;
  if(!cur.over && cur.inst.swipe && Math.max(Math.abs(dx), Math.abs(dy)) > 24){
    cur.inst.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }
  if(!cur.over && cur.inst.release) cur.inst.release();
});
cv.addEventListener('pointercancel', function(){ ptr.down = false; ptr.active = false; });
cv.addEventListener('pointerleave', function(){ ptr.down = false; ptr.active = false; });
cv.addEventListener('contextmenu', function(e){
  e.preventDefault();
  if(!cur || cur.over) return;
  var p = pos(e);
  if(cur.inst.tap) cur.inst.tap(p.x, p.y, 2);
});
</script>
</body>
